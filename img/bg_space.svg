<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 原画の宇宙グラデーション -->
    <linearGradient id="space-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a527a" />
      <stop offset="30%" stop-color="#6b6896" />
      <stop offset="70%" stop-color="#56638a" />
      <stop offset="100%" stop-color="#7c98b3" />
    </linearGradient>
    <!-- 十字に光る星のパーツ -->
    <g id="star-L">
      <path d="M 0,-12 C 1,-3 3,-1 12,0 C 3,1 1,3 0,12 C -1,3 -3,1 -12,0 C -3,-1 -1,-3 0,-12 Z" fill="#ffffff" />
    </g>
    <g id="star-S">
      <path d="M 0,-6 C 0.5,-1.5 1.5,-0.5 6,0 C 1.5,0.5 0.5,1.5 0,6 C -0.5,1.5 -1.5,0.5 -6,0 C -1.5,-0.5 -0.5,-1.5 0,-6 Z" fill="#ffffff" />
    </g>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景ベース -->
  <rect width="1280" height="660" fill="url(#space-bg)" />

  <!-- カラフルなボケ玉（マゼンタ・シアン・パープル） -->
  <g opacity="0.75">
    <circle cx="85" cy="42" r="9" fill="#d55b98" />
    <circle cx="145" cy="70" r="8" fill="#5ec2e6" />
    <circle cx="152" cy="18" r="10" fill="#7065b0" />
    <circle cx="222" cy="52" r="12" fill="#5ec2e6" />
    <circle cx="280" cy="40" r="8" fill="#d55b98" />
    <circle cx="485" cy="20" r="9" fill="#d55b98" />
    <circle cx="520" cy="55" r="7" fill="#5ec2e6" />
    <circle cx="715" cy="65" r="7" fill="#5ec2e6" />
    <circle cx="775" cy="18" r="7" fill="#7065b0" />
    <circle cx="808" cy="30" r="8" fill="#d55b98" />
    <circle cx="835" cy="72" r="10" fill="#5ec2e6" />
    <circle cx="965" cy="38" r="9" fill="#d55b98" />
    <circle cx="1010" cy="78" r="6" fill="#5ec2e6" />
    <circle cx="1150" cy="75" r="9" fill="#d55b98" />
    <circle cx="1235" cy="35" r="11" fill="#5ec2e6" />
    <!-- 左右の端のドット（枠の外側に見える部分） -->
    <circle cx="8" cy="210" r="7" fill="#5ec2e6" />
    <circle cx="6" cy="495" r="9" fill="#f48fb1" />
    <circle cx="1272" cy="180" r="8" fill="#5ec2e6" />
    <circle cx="1274" cy="420" r="7" fill="#d55b98" />
  </g>

  <!-- 細かい星粒 -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="30" cy="25" r="2" /><circle cx="70" cy="80" r="2.5" /><circle cx="120" cy="30" r="1.5" />
    <circle cx="195" cy="85" r="2" /><circle cx="250" cy="22" r="3" /><circle cx="310" cy="75" r="2" />
    <circle cx="360" cy="30" r="2.5" /><circle cx="430" cy="45" r="1.5" /><circle cx="540" cy="28" r="2" />
    <circle cx="660" cy="25" r="2" /><circle cx="745" cy="40" r="2.5" /><circle cx="870" cy="25" r="2" />
    <circle cx="920" cy="65" r="3" /><circle cx="1040" cy="30" r="2" /><circle cx="1095" cy="55" r="2.5" />
    <circle cx="1180" cy="22" r="2" /><circle cx="1255" cy="75" r="2" />
  </g>

  <!-- キラキラ十字星 -->
  <g filter="url(#glow)">
    <use href="#star-L" x="45" y="12" />
    <use href="#star-S" x="58" y="62" />
    <use href="#star-S" x="178" y="60" />
    <use href="#star-L" x="242" y="65" />
    <use href="#star-S" x="302" y="38" />
    <use href="#star-S" x="462" y="88" />
    <use href="#star-L" x="700" y="32" />
    <use href="#star-S" x="742" y="12" />
    <use href="#star-L" x="895" y="82" />
    <use href="#star-S" x="1032" y="75" />
    <use href="#star-L" x="1220" y="78" />
    <use href="#star-S" x="6" y="458" />
  </g>
</svg>