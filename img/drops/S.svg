<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- 1. 球体全体のドロップシャドウ（クールなダークブルーグレーの影） -->
    <filter id="sphere-shadow-silver" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#0f1722" flood-opacity="0.45" />
    </filter>

    <!-- 2. 猫の刻印風シャドウ（白い反射光でエッジを立たせる） -->
    <filter id="cat-emboss-silver" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#ffffff" flood-opacity="0.8" />
    </filter>

    <!-- 3. ベースのメタリックシルバー球体グラデーション（明暗差と青みで金属感を強調） -->
    <radialGradient id="silver-sphere" cx="35%" cy="30%" r="65%" fx="25%" fy="20%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#f8fbff" />
      <stop offset="40%" stop-color="#d0dae5" />
      <stop offset="68%" stop-color="#7b8a9a" />
      <stop offset="88%" stop-color="#37424f" />
      <stop offset="96%" stop-color="#687685" />
      <stop offset="100%" stop-color="#222a33" />
    </radialGradient>

    <!-- 4. 下部からの照り返し（クロームのようなシャープな反射光） -->
    <radialGradient id="bottom-bounce-silver" cx="65%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#b8c7d9" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#37424f" stop-opacity="0" />
    </radialGradient>

    <!-- 5. キャンディ・ドロップのような上部ツヤハイライト -->
    <linearGradient id="gloss-top-silver" x1="30%" y1="0%" x2="60%" y2="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- 6. 猫のライン用ガンメタル（黒銀）グラデーション -->
    <linearGradient id="cat-line-grad-silver" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#526070" />
      <stop offset="50%" stop-color="#2c3540" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- 7. 猫の内側を明るく輝かせるグラデーション -->
    <radialGradient id="cat-inner-glow-silver" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="45%" stop-color="#e3edf7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8fa0b3" stop-opacity="0.05" />
    </radialGradient>
  </defs>

  <!-- メインの球体グループ -->
  <g filter="url(#sphere-shadow-silver)">
    <!-- ベース球体 -->
    <circle cx="150" cy="150" r="136" fill="url(#silver-sphere)" />

    <!-- メタリックな照り返し（右下部分） -->
    <circle cx="150" cy="150" r="136" fill="url(#bottom-bounce-silver)" />

    <!-- 球体のフチの立体感を強めるインナーリング -->
    <circle cx="150" cy="150" r="134" fill="none" stroke="#1c242b" stroke-width="3" opacity="0.45" />
  </g>

  <!-- 猫のモチーフ（球体の丸みに合わせて配置） -->
  <g filter="url(#cat-emboss-silver)" stroke="url(#cat-line-grad-silver)" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- 猫の輪郭 -->
    <path d="M 122 86
             C 112 52, 92 48, 78 72
             C 70 86, 65 98, 68 106
             C 62 122, 56 148, 56 168
             C 56 206, 82 222, 150 222
             C 218 222, 244 206, 244 168
             C 244 148, 238 122, 232 106
             C 235 98, 230 86, 222 72
             C 208 48, 188 52, 178 86
             Q 150 88, 122 86 Z" fill="url(#cat-inner-glow-silver)" stroke-width="7.5" />

    <!-- 左目 -->
    <circle cx="108" cy="136" r="16" fill="url(#cat-inner-glow-silver)" stroke-width="6.5" />
    
    <!-- 右目 -->
    <circle cx="190" cy="136" r="16" fill="url(#cat-inner-glow-silver)" stroke-width="6.5" />

    <!-- 左ひげ -->
    <path d="M 56 154 C 42 150, 26 158, 32 164 C 36 168, 46 160, 56 162" fill="none" stroke-width="5.5" />
    <path d="M 57 174 C 42 180, 24 198, 30 204 C 36 210, 46 190, 59 182" fill="none" stroke-width="5.5" />

    <!-- 右ひげ -->
    <path d="M 244 154 C 258 150, 274 158, 268 164 C 264 168, 254 160, 244 162" fill="none" stroke-width="5.5" />
    <path d="M 243 174 C 258 180, 276 198, 270 204 C 264 210, 254 190, 241 182" fill="none" stroke-width="5.5" />
  </g>

  <!-- ドロップス感を出す表面の強い光沢 -->
  <!-- 1. 上部の大きなツヤ -->
  <ellipse cx="135" cy="78" rx="95" ry="52" transform="rotate(-12 135 78)" fill="url(#gloss-top-silver)" style="pointer-events: none;" />

  <!-- 2. 左上の鋭いピンスポットハイライト -->
  <ellipse cx="82" cy="72" rx="28" ry="14" transform="rotate(-38 82 72)" fill="#ffffff" opacity="0.9" />
  <circle cx="62" cy="96" r="6" fill="#ffffff" opacity="0.8" />

  <!-- 3. 右下のエッジに沿った細いリムライト（鋭い白銀の反射） -->
  <path d="M 255 195 A 120 120 0 0 1 165 270" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.65" />
</svg>